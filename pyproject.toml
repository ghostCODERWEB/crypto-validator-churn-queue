[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-validator-churn-queue"
version = "0.1.0"
description = "Replay bounded validator entry and exit queues with FIFO churn capacity, minimum active count and duplicate guards."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-validator-churn-queue = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
